<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="What one fsm_dispatch call does">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
      .lbl  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; }
      .ink  { fill: #1f2328; } .mut { fill: #57606a; } .ok { fill: #1a7f37; } .no { fill: #9a6700; }
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="408" rx="10" fill="#fbfcfd" stroke="#d0d7de"/>

  <text class="code" x="24" y="34" fill="#0969da">fsm_dispatch(&amp;m, EV_COIN);</text>
  <rect x="536" y="18" width="160" height="24" rx="12" fill="#eef2f6" stroke="#d0d7de"/>
  <text class="code" x="616" y="34" text-anchor="middle" fill="#57606a">state: LOCKED</text>

  <line x1="30" y1="62" x2="30" y2="218" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="48" y="56" width="470" height="30" rx="6" fill="#fff" stroke="#d8dee4"/>
  <text class="code mut" x="60" y="76" fill="#57606a">{ UNLOCKED, EV_COIN, LOCKED, NULL, let_through }</text>
  <text class="lbl no" x="532" y="76" fill="#9a6700">✗ wrong state</text>

  <rect x="48" y="94" width="470" height="30" rx="6" fill="#fff" stroke="#d8dee4"/>
  <text class="code mut" x="60" y="114" fill="#57606a">{ LOCKED, EV_PUSH, FSM_SAME, NULL, refuse }</text>
  <text class="lbl no" x="532" y="114" fill="#9a6700">✗ wrong event</text>

  <rect x="48" y="132" width="470" height="30" rx="6" fill="#fff" stroke="#d8dee4"/>
  <text class="code mut" x="60" y="152" fill="#57606a">{ LOCKED, EV_COIN, JAMMED, is_jammed, NULL }</text>
  <text class="lbl no" x="532" y="152" fill="#9a6700">✗ guard said no</text>

  <rect x="48" y="170" width="470" height="30" rx="6" fill="#e6f4ea" stroke="#1a7f37"/>
  <text class="code ink" x="60" y="190" fill="#1f2328">{ LOCKED, EV_COIN, UNLOCKED, NULL, take_coin }</text>
  <text class="lbl ok" x="532" y="190" fill="#1a7f37">✓ first fit wins</text>

  <line x1="283" y1="206" x2="283" y2="252" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="48" y="258" width="176" height="36" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code ink" x="136" y="281" text-anchor="middle" fill="#1f2328">on_exit(LOCKED)</text>
  <line x1="228" y1="276" x2="252" y2="276" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="256" y="258" width="176" height="36" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code ink" x="344" y="281" text-anchor="middle" fill="#1f2328">take_coin(ctx)</text>
  <line x1="436" y1="276" x2="460" y2="276" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="464" y="258" width="208" height="36" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code ink" x="568" y="281" text-anchor="middle" fill="#1f2328">on_enter(UNLOCKED)</text>

  <line x1="360" y1="300" x2="360" y2="326" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="code ink" x="360" y="348" text-anchor="middle" fill="#1f2328">m.state = UNLOCKED</text>
  <text class="lbl ok" x="360" y="366" text-anchor="middle" fill="#1a7f37">returns FSM_OK</text>

  <line x1="24" y1="380" x2="696" y2="380" stroke="#e4e8ec"/>
  <text class="lbl mut" x="24" y="398" fill="#57606a">No row fits? Nothing runs at all, and you get FSM_IGNORED — that is normal, not an error.</text>
</svg>
