<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="How the ctx pointer reaches your callbacks">
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; fill: #1f2328; }
      .sub  { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect x="1" y="1" width="718" height="228" rx="10" fill="#fbfcfd" stroke="#d0d7de"/>

  <rect x="24" y="72" width="180" height="76" rx="8" fill="#fff" stroke="#0969da"/>
  <text class="code" x="114" y="100" text-anchor="middle">struct till t;</text>
  <text class="sub"  x="114" y="122" text-anchor="middle">your own data —</text>
  <text class="sub"  x="114" y="138" text-anchor="middle">counter, socket, handle</text>

  <line x1="208" y1="110" x2="272" y2="110" stroke="#57606a" stroke-width="1.5" marker-end="url(#c)"/>
  <text class="sub" x="240" y="98" text-anchor="middle">&amp;t</text>

  <rect x="276" y="72" width="152" height="76" rx="8" fill="#fff" stroke="#d0d7de"/>
  <text class="code" x="352" y="104" text-anchor="middle">fsm_init(...)</text>
  <text class="sub"  x="352" y="126" text-anchor="middle">stores it in m.ctx</text>

  <line x1="432" y1="110" x2="492" y2="42"  stroke="#57606a" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="432" y1="110" x2="492" y2="88"  stroke="#57606a" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="432" y1="110" x2="492" y2="134" stroke="#57606a" stroke-width="1.3" marker-end="url(#c)"/>
  <line x1="432" y1="110" x2="492" y2="180" stroke="#57606a" stroke-width="1.3" marker-end="url(#c)"/>

  <rect x="496" y="22"  width="200" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code" x="596" y="44"  text-anchor="middle">guard(void *ctx)</text>
  <rect x="496" y="68"  width="200" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code" x="596" y="90"  text-anchor="middle">action(void *ctx)</text>
  <rect x="496" y="114" width="200" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code" x="596" y="136" text-anchor="middle">on_enter(void *ctx)</text>
  <rect x="496" y="160" width="200" height="34" rx="6" fill="#fff" stroke="#d0d7de"/>
  <text class="code" x="596" y="182" text-anchor="middle">on_exit(void *ctx)</text>

  <text class="sub" x="24" y="212">Same pointer, handed to every callback. The library never looks inside it — no malloc, no globals.</text>
</svg>
